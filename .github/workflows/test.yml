name: test
on:
  pull_request:
  push:
    branches: [cursor/founding-supporter-landing-014d]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run lint
      - run: npm run build
